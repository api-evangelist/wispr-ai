aid: wispr-ai
name: Wispr AI
description: Wispr AI is the company behind Wispr Flow, an AI voice-to-text dictation
  product that turns natural speech into polished, formatted text in any application
  across macOS, Windows, iOS, and Android, with AI auto-edits, a personal dictionary,
  voice snippets, tone styling, and support for 100+ languages. Wispr has raised $81M
  to build what it calls the Voice OS, publishes an enterprise trust center with SOC 2
  Type II, ISO 27001, and HIPAA attestations, and operates a public backend API at
  api.wisprflow.ai whose OpenAPI describes authentication, dictionary, teams, history,
  notes, and payments surfaces used by its clients.
