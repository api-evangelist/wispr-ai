                type: string
  /email/reset-password:
    post:
      tags:
      - Authentication
      summary: Reset Password
      operationId: reset_password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /email/request-reset-password:
    post:
      tags:
      - Authentication
      summary: Request Reset Password
      description: 'Request a password reset email for a user.


        Args:

        reset_request: The request containing the user''s email

        authentication_service: Authentication service instance

        supabase_client: Supabase client instance


        Returns:

        JSON response indicating success/failure of the request'
      operationId: request_reset_password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestResetPasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /email/request-reset-password-captcha:
    post:
      tags:
      - Authentication
      summary: Request Reset Password Captcha
      description: 'Request a password reset email for a user.


        Args:

        reset_request: The request containing the user''s email and captcha token

        authentication_service: Authentication service instance

        supabase_client: Supabase client instance


        Returns:

        JSON response indicating success/failure of the request'
      operationId: request_reset_password_captcha
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestResetPasswordCaptchaRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
