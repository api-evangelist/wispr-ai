  /sso/callback:
    get:
      tags:
      - Authentication
      summary: Sso Callback
      description: 'Handle SSO callback for both SP-initiated and IdP-initiated flows.


        SP-initiated: Has session parameter → uses PKCE-enabled Supabase client

        IdP-initiated: No session parameter → uses admin Supabase client

        AuthKit tracer: state parameter without session → AuthKit callback, with legacy fallback'
      operationId: sso_callback
      parameters:
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
      - name: is_platform_user
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Is Platform User
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /user_status:
    get:
      tags:
      - Authentication
      summary: User Status
      operationId: user_status
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
          title: Email
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /email_verification_status:
    get:
      tags:
      - Authentication
      summary: Email Verification Status
      description: 'Check if a user''s email is verified by checking the email_confirmed_at field.


        Args:

        user_id: The Supabase user ID


        Returns:

        A response with the is_verified status'
      operationId: email_verification_status
      parameters:
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /signup:
    post:
      tags:
