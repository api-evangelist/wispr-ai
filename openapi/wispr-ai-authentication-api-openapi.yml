          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /email/validate:
    get:
      tags:
      - Authentication
      summary: Validate Email
      description: 'Validate an email address using Twilio SendGrid''s API for signup.


        Args:

        email: The email address to validate


        Returns:

        A JSON response with the validation result (dictionary with "verdict" and "score") and status code'
      operationId: validate_email
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
          title: Email
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /.well-known/apple-app-site-association:
    get:
      tags:
      - Authentication
      summary: Apple App Site Association
      description: Returns the Apple App Site Association file.
      operationId: apple_app_site_association
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /email/create-user:
    post:
      tags:
      - Authentication
      summary: Create User
      description: 'Admin endpoint to create a new user and send them a password reset email.

        Only accessible by Wispr admins (@wispr.ai emails).'
      operationId: create_user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '429':
          description: Too Many Requests
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /device/complete:
    post:
      tags:
      - Authentication
      summary: Device Complete
      description: 'Called by the web app after successful auth to submit tokens for a device code.

        Pushes tokens to a Redis list — the Server-Sent Events (SSE) stream picks them up instantly via BLPOP.'
      operationId: device_complete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCodeCompleteRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /device/stream:
    get:
      tags:
      - Authentication
      summary: Device Stream
      description: 'Server-Sent Events (SSE) endpoint — desktop holds this connection open until tokens arrive or timeout.

        Uses Redis BLPOP (blocking list pop) to block until data is pushed, with 25s cycles

        for Application Load Balancer (ALB) heartbeats.'
      operationId: device_stream
      parameters:
      - name: device_code
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Device Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /device/poll:
    get:
      tags:
      - Authentication
      summary: Device Poll
      description: 'Fallback polling endpoint — desktop uses this if the SSE connection drops.

        Checks both the main list (LPOP) and the delivered key (GETDEL) in case

        BLPOP consumed the token but the SSE stream died before delivery.'
      operationId: device_poll
      parameters:
      - name: device_code
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Device Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    DeviceAuthResponse:
      properties:
        status:
          type: string
          enum:
          - complete
          - pending
          - timeout
          title: Status
        access_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Access Token
        refresh_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Refresh Token
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
        onboarding_completed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Onboarding Completed
        dub_click_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Dub Click Id
        referral:
          anyOf:
          - type: string
          - type: 'null'
          title: Referral
        promo_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Promo Code
        fbp:
          anyOf:
          - type: string
          - type: 'null'
          title: Fbp
        fbc:
          anyOf:
          - type: string
          - type: 'null'
          title: Fbc
        team_invite_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Team Invite Code
      type: object
      required:
      - status
      title: DeviceAuthResponse
