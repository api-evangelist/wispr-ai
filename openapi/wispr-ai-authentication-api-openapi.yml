  /email/login:
    get:
      tags:
      - Authentication
      summary: Email Callback
      description: Handle email verification callback from Supabase.
      operationId: email_callback
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /email/reset-password-callback:
