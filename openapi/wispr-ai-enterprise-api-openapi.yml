components:
  schemas:
    DomainCapturePolicy:
      type: string
      enum:
      - unset
      - 'off'
      - require
      title: DomainCapturePolicy
      description: 'Whether unclaimed users on a verified domain are required to request to join the enterprise.


        ``unset`` indicates the admin has not chosen a policy — distinct from explicitly ``off``.

        Both ``off`` and ``require`` require a DNS-verified domain before they may be set;

        ``unset`` is the only value allowed when no domain has been verified yet.

        ``off`` means that they have intentionally turned off domain capture so users can keep using flow without being prompted to join the enterprise.'
    AuditLogEntry:
      properties:
        event_id:
          type: string
          title: Event Id
          description: Stable per-event id, deterministic from the source row and action (e.g. `<uuid>:member.added`).
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        action:
          $ref: '#/components/schemas/AuditAction'
        actor_user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor User Id
          description: Who performed the action; null when the source actor column is null.
        actor_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Email
        actor_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Name
        target_user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Target User Id
          description: Who the action was performed on.
        target_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Email
        target_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Name
        method:
          anyOf:
          - type: string
          - type: 'null'
          title: Method
          description: Source-specific method (membership add/removal method); null for join-request events.
        source:
          type: string
          title: Source
          description: The table the event was derived from.
      type: object
      required:
      - event_id
      - timestamp
      - action
      - actor_user_id
      - actor_email
      - actor_name
      - target_user_id
      - target_email
      - target_name
      - method
      - source
      title: AuditLogEntry
      description: One derived audit event for the enterprise admin audit log.
    SelfInviteResponse:
      properties:
        message:
          type: string
          title: Message
        should_refetch:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Should Refetch
      type: object
      required:
      - message
      title: SelfInviteResponse
      description: Response model for self-invite endpoint
    BulkInviteRequest:
      properties:
        invites:
          items:
            $ref: '#/components/schemas/InviteRequest'
          type: array
          title: Invites
      type: object
      required:
      - invites
      title: BulkInviteRequest
    CreateEnterpriseRequestNew:
      properties:
        name:
          type: string
          title: Name
        autoInviteUsers:
          type: boolean
          title: Autoinviteusers
          default: true
      type: object
      required:
      - name
      title: CreateEnterpriseRequestNew
    EnterpriseMemberRowResponse:
      properties:
        userId:
          type: string
          title: Userid
        firstName:
          anyOf:
          - type: string
          - type: 'null'
          title: Firstname
        lastName:
          anyOf:
          - type: string
          - type: 'null'
          title: Lastname
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        role:
          anyOf:
          - $ref: '#/components/schemas/EnterpriseRole'
          - type: 'null'
        status:
          type: string
          enum:
          - active
          - trialing
          title: Status
        trialEndsAt:
          anyOf:
          - type: integer
          - type: 'null'
          title: Trialendsat
        teamId:
          anyOf:
          - type: string
          - type: 'null'
          title: Teamid
        teamName:
          anyOf:
          - type: string
          - type: 'null'
          title: Teamname
        teamRole:
          anyOf:
          - $ref: '#/components/schemas/TeamMemberRole'
          - type: 'null'
          description: The user's per-team membership role on the joined ``teamId``. ``admin`` or ``member`` when the user has an active team membership; ``null`` when they have no active membership (pending) or the stored role is an unrecognized legacy value. Distinct from the enterprise-level ``role`` field above.
        totalWords:
          type: integer
          title: Totalwords
        wordsInWindow:
          anyOf:
          - type: integer
          - type: 'null'
          title: Wordsinwindow
        wpm:
          anyOf:
          - type: number
          - type: 'null'
          title: Wpm
        lastUsedAt:
          anyOf:
          - type: integer
          - type: 'null'
          title: Lastusedat
        joinedAt:
          anyOf:
          - type: integer
          - type: 'null'
          title: Joinedat
      type: object
      required:
      - userId
      - firstName
      - lastName
      - email
      - role
      - status
      - trialEndsAt
      - teamId
      - teamName
      - totalWords
      - wordsInWindow
      - wpm
      - lastUsedAt
      - joinedAt
      title: EnterpriseMemberRowResponse
      description: "One row of the admin-portal enterprise members table.\n\n``trialEndsAt`` is set only when ``status == \"trialing\"``; the field is\nomitted (``None``) for active members.\n\n``lastUsedAt`` is unix seconds (``GREATEST(desktop_last_transcript_timestamp,\nmobile_last_transcript_timestamp)``). ``None`` when the user has never\ndictated on either platform. ``wpm`` and ``lastUsedAt`` are lifetime values\nregardless of the active ``words_window`` — only the words column varies.\n\n``joinedAt`` is unix seconds of ``MIN(user_team_membership.added_at)`` across\nall membership rows for this user in this enterprise (active + soft-deleted)\nso it survives team moves. ``None`` when no membership rows exist (e.g. an\nSSO-provisioned user not yet placed on any team).\n\n``wpm`` is the user's lifetime average words-per-minute (``UserStats.words_per_minute``).\n``None`` when the user has no dictation history so the UI can render an em-dash\ninstead of a meaningless ``0 WPM``.\n\n``wordsInWindow`` mirrors ``totalWords`` but for the request's ``words_window``:\n  * ``None`` exactly when ``words_window == \"all_time\"`` — the UI should\n    read ``totalWords`` for the cell. ``None`` here means \"this field is\n    not in play for this request\"; it must not be used as a substitute for\n    zero.\n  * ``0`` when a window is active and the user has no dictations inside it\n    — the UI should render ``0`` (not an em-dash).\n  * Positive integer otherwise."
    ListDomainVerificationsResponse:
      properties:
        domains:
          items:
            $ref: '#/components/schemas/DomainVerificationStatus'
          type: array
          title: Domains
      type: object
      required:
      - domains
      title: ListDomainVerificationsResponse
      description: Response returned by the admin ``GET /domains/verifications`` endpoint.
    BulkInviteResponse:
