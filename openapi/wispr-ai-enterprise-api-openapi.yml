        domain_capture_policy:
          $ref: '#/components/schemas/DomainCapturePolicy'
          description: Per-domain capture policy. ``unset`` while unverified; ``off``/``require`` once verified.
      type: object
      required:
      - domain_id
      - enterprise_id
      - domain
      - verified
      - verified_at
      - verification_initiated_at
      - last_verification_check_at
      - verification_attempts
      - token_active
      - record
      - domain_capture_policy
      title: DomainVerificationStatus
      description: 'Per-domain verification state returned by the enterprise and internal APIs.


        The ``record`` field is populated only on superadmin (internal) reads while

