          anyOf:
          - type: string
          - type: 'null'
          title: Logo
      type: object
      title: UpdateEnterpriseRequest
    DomainVerificationStatus:
      properties:
        domain_id:
          type: string
          title: Domain Id
        enterprise_id:
          type: string
          title: Enterprise Id
        domain:
          type: string
          title: Domain
        verified:
          type: boolean
          title: Verified
        verified_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Verified At
          description: ISO-8601 timestamp of verification, or ``null`` if unverified.
        verification_initiated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Verification Initiated At
          description: ISO-8601 timestamp of when the token was first issued, or ``null`` if never initiated.
        last_verification_check_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Verification Check At
          description: ISO-8601 timestamp of the last DNS poll, or ``null`` if never polled.
        verification_attempts:
          type: integer
