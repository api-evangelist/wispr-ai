          default: 0
        team_member_count:
          type: integer
          title: Team Member Count
          description: Total members on the enterprise team (roster size).
          default: 0
        offset:
          anyOf:
          - type: integer
          - type: 'null'
          title: Offset
          description: Pagination offset when a page size was requested; null for full-roster responses.
        limit:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
          description: Page size when paginated; null when the client omitted limit (full roster).
      type: object
      required:
      - users
      title: EnterpriseUsageResponse
      description: Response model for enterprise usage statistics
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AttributionPlatform:
