components:
  schemas:
    ProvisionedCostCenterSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - name
      title: ProvisionedCostCenterSummary
      description: The cost center created by a successful provision.
    EnterpriseDomainItem:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        domain:
          type: string
          title: Domain
        deleted:
          type: boolean
          title: Deleted
        created_at:
          type: string
          format: date-time
          title: Created At
        domain_capture_policy:
          type: string
          enum:
          - unset
          - 'off'
          - require
          title: Domain Capture Policy
      type: object
      required:
      - id
      - domain
      - deleted
      - created_at
      - domain_capture_policy
      title: EnterpriseDomainItem
      description: Response model for an enterprise domain.
    MeetingAudioUrlResponse:
      properties:
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
      type: object
      title: MeetingAudioUrlResponse
      description: Presigned GET URL for one meeting's audio, if present.
    ProvisionedInvoiceSummary:
      properties:
        stripe_invoice_id:
          type: string
          title: Stripe Invoice Id
        status:
          type: string
          enum:
          - sent
          - already_paid
          title: Status
      type: object
      required:
      - stripe_invoice_id
      - status
      title: ProvisionedInvoiceSummary
      description: The invoice sent (or already paid) by a successful provision.
    EnterprisePilotsResponse:
      properties:
        pilots:
          items:
            $ref: '#/components/schemas/EnterprisePilotItem'
          type: array
          title: Pilots
        total:
          type: integer
          title: Total
      type: object
      required:
      - pilots
      - total
      title: EnterprisePilotsResponse
      description: Response model for listing enterprise pilots.
    SyncDomainsToWorkosResponse:
      properties:
        message:
          type: string
          title: Message
        workos_synced:
          type: boolean
          title: Workos Synced
          description: Whether the domains were successfully synced to WorkOS
      type: object
      required:
      - message
      - workos_synced
      title: SyncDomainsToWorkosResponse
      description: Response model for syncing enterprise domains to WorkOS.
    PreviewResponse:
      properties:
        preview:
          type: object
          title: Preview
      type: object
      required:
      - preview
      title: PreviewResponse
    SendInvoiceRequest:
      properties:
        invoice_id:
          type: string
          minLength: 1
          title: Invoice Id
          description: Stripe draft invoice ID to finalize and send
        po_number:
          type: string
          maxLength: 100
          minLength: 1
          title: Po Number
          description: Purchase order number
      type: object
      required:
      - invoice_id
      - po_number
      title: SendInvoiceRequest
      description: Request model for sending a pending invoice.
    EnterpriseBillingConfigCreate:
      properties:
        next_true_up_date:
          type: string
          format: date-time
          title: Next True Up Date
        true_up_period_days:
          type: integer
          enum:
          - 30
          - 90
          - 365
          title: True Up Period Days
          description: Billing period in days (monthly, quarterly, annual)
        stripe_price_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Stripe Price Id
          description: Stripe price ID. If omitted, resolved from product_name + currency.
        product_name:
          type: string
          minLength: 1
          title: Product Name
        payment_terms_days:
          type: integer
          minimum: 1.0
          title: Payment Terms Days
          default: 7
        custom_unit_price_cents:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Custom Unit Price Cents
        pricing_tiers:
          anyOf:
          - items:
              $ref: '#/components/schemas/PricingTierSchema'
            type: array
          - type: 'null'
          title: Pricing Tiers
        currency:
          $ref: '#/components/schemas/Currency'
          default: usd
        seat_cap:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Seat Cap
          description: Maximum seats allowed for this enterprise
        contract_end_date:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Contract End Date
        contract_period_days:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Contract Period Days
        enterprise_id:
          type: string
          format: uuid
          title: Enterprise Id
      type: object
      required:
      - next_true_up_date
      - true_up_period_days
      - product_name
      - enterprise_id
      title: EnterpriseBillingConfigCreate
      description: Request model for creating a billing config.
    ListRecentInvoicesResponse:
      properties:
        draft:
          anyOf:
          - $ref: '#/components/schemas/InvoiceSummary'
          - type: 'null'
        open:
          anyOf:
          - $ref: '#/components/schemas/InvoiceSummary'
          - type: 'null'
      type: object
      required:
      - draft
      - open
      title: ListRecentInvoicesResponse
      description: 'The two most-recent invoices an operator might want to act on.


        ``open`` covers the past_due case as well — Stripe treats past_due as just

        an ``open`` invoice past its due_date, so a single ``open`` slot is enough

        for the picker. Acting on the ``open`` row triggers the void-and-reissue

        flow inside ``add_po_to_invoice``; the ``draft`` row is editable in place.

        Either slot may be null when no such invoice exists for the customer.'
    UpdatePilotEndRequest:
      properties:
        pilot_end:
          type: string
          format: date
          title: Pilot End
      type: object
      required:
      - pilot_end
      title: UpdatePilotEndRequest
      description: Request model for updating an enterprise pilot end date.
    CreateCodesResponse:
      properties:
        created_count:
          type: integer
          title: Created Count
        created_codes:
          items:
            $ref: '#/components/schemas/CodeListItem'
          type: array
          title: Created Codes
      type: object
      required:
      - created_count
      - created_codes
      title: CreateCodesResponse
      description: 'Result of creating promo codes: count and the created rows.'
    ConsensusPreviewRequest:
      properties:
        algorithm_id:
          $ref: '#/components/schemas/AlgorithmId'
      type: object
      required:
      - algorithm_id
      title: ConsensusPreviewRequest
      description: Explicit consensus implementation selection.
    FlowStatePreviewRequest:
      properties:
        reporting_month:
          type: string
          format: date
          title: Reporting Month
        emails:
          anyOf:
          - items:
              type: string
              format: email
            type: array
          - type: 'null'
          title: Emails
        domain:
          anyOf:
          - type: string
          - type: 'null'
          title: Domain
        user_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: User Ids
        limit:
          type: integer
          maximum: 500.0
          minimum: 1.0
          title: Limit
          default: 100
        offset:
          type: integer
          minimum: 0.0
          title: Offset
          default: 0
      type: object
      required:
      - reporting_month
      title: FlowStatePreviewRequest
      description: Request body for previewing generated profiles before send.
    ConsensusActualMode:
      type: string
      enum:
      - anonymous
      - cluster
      - segment
      title: ConsensusActualMode
      description: The implementation path that produced a preview result.
    FailedAddUserItem:
      properties:
        email:
          type: string
          format: email
          title: Email
        reason:
          type: string
          title: Reason
      type: object
      required:
      - email
      - reason
      title: FailedAddUserItem
      description: Details about a user that failed to be added
    DomainVerificationStatus:
      properties:
        domain_id:
          type: string
          title: Domain Id
        enterprise_id:
          type: string
          title: Enterprise Id
        domain:
          type: string
          title: Domain
        verified:
          type: boolean
          title: Verified
        verified_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Verified At
          description: ISO-8601 timestamp of verification, or ``null`` if unverified.
        verification_initiated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Verification Initiated At
          description: ISO-8601 timestamp of when the token was first issued, or ``null`` if never initiated.
        last_verification_check_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Verification Check At
          description: ISO-8601 timestamp of the last DNS poll, or ``null`` if never polled.
        verification_attempts:
          type: integer
          title: Verification Attempts
          description: Number of DNS check attempts made against this domain.
        token_active:
          type: boolean
          title: Token Active
          description: True iff a verification token is currently issued and the domain is not yet verified.
        record:
          anyOf:
          - $ref: '#/components/schemas/DomainVerificationRecord'
          - type: 'null'
          description: The TXT record to publish. Populated only on superadmin reads while unverified; always ``null`` on admin-facing reads.
        domain_capture_policy:
          $ref: '#/components/schemas/DomainCapturePolicy'
          description: Per-domain capture policy. ``unset`` while unverified; ``off``/``require`` once verified.
      type: object
      required:
      - domain_id
      - enterprise_id
      - domain
      - verified
      - verified_at
      - verification_initiated_at
      - last_verification_check_at
      - verification_attempts
      - token_active
      - record
      - domain_capture_policy
      title: DomainVerificationStatus
