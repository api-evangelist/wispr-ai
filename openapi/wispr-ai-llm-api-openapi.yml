openapi: 3.2.0
info:
  title: Wispr Backend LLM API
  description: Wispr Backend API
  version: 0.5.2
tags:
- name: LLM
paths:
  /llm/api:
    post:
      tags:
      - LLM
      summary: Flow Api
      operationId: flow_api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_flow_api_llm_api_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /llm/asr:
    post:
      tags:
      - LLM
      summary: Asr
      operationId: asr
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_asr_llm_asr_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /llm/formatting:
    post:
      tags:
      - LLM
      summary: Formatting
      operationId: formatting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormattingRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /llm/completion:
    post:
      tags:
      - LLM
      summary: Completion
      operationId: completion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /llm/ocr:
    post:
      tags:
      - LLM
      summary: Ocr
      operationId: ocr
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OCRRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /llm/extract_asr_words:
    post:
      tags:
      - LLM
      summary: Extract Asr Words
      operationId: extract_asr_words
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractASRWordsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /llm/format_non_english:
    post:
      tags:
      - LLM
      summary: Format Non English Endpoint
      operationId: format_non_english_endpoint
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NonEnglishFormattingRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /llm/asr_audio_chunks:
    post:
      tags:
      - LLM
      summary: Asr Audio Chunks
      operationId: asr_audio_chunks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsrAudioChunksRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /llm/command_mode_route:
    post:
      tags:
      - LLM
      summary: Command Mode Route
      operationId: command_mode_route
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandModeRouteRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /llm/command_mode:
    post:
      tags:
      - LLM
      summary: Command Mode
      operationId: command_mode
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandModeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /llm/instruct_mode:
    post:
      tags:
      - LLM
      summary: Instruct Mode
      operationId: instruct_mode
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstructModeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructModeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /llm/polish_text:
    post:
      tags:
      - LLM
      summary: Polish Text
      operationId: polish_text
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolishTextRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolishTextResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /llm/extract_edited_words:
    post:
      tags:
      - LLM
      summary: Extract Edited Words
      description: 'Extract proper nouns, technical terms, or domain-specific terms that were edited

        between the original pasted text and the edited text.'
      operationId: extract_edited_words
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractEditedWordsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractEditedWordsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /llm/classify_intent:
    post:
      tags:
      - LLM
      summary: Classify Intent
      description: 'Classify voice input into one of the provided routes.


        Returns the matched route plus optional per-route structured data the classifier'
      operationId: classify_intent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyIntentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyIntentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /llm/detect_formality:
    post:
      tags:
      - LLM
      summary: Detect Formality
      description: 'Classify text messages into one of three formality levels based on

        capitalization, punctuation and other use of informal language.

        Levels: very_casual, casual, formal'
      operationId: detect_formality
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectFormalityRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectFormalityResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /llm/check_sensibility:
    post:
      tags:
      - LLM
      summary: Check Sensibility
      description: 'Check if a transcribed message makes sense in context.

        Returns a score from 0.0 (nonsensical) to 1.0 (makes perfect sense).

        Used to warn users before they send potentially embarrassing messages.'
      operationId: check_sensibility
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckSensibilityRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckSensibilityResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /llm/chat:
    post:
      tags:
      - LLM
      summary: Flow Response
      operationId: flow_response
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowResponseRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /llm/flow_state_2025:
    get:
      tags:
      - LLM
      summary: Fetch Flow State 2025
      operationId: fetch_flow_state_2025
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowState2025Response'
      security:
      - ApiKeyHeaderPatched: []
    post:
      tags:
      - LLM
      summary: Create Flow State 2025
      operationId: create_flow_state_2025
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoryRowsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowState2025Response'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /llm/voice_profile/latest:
    get:
      tags:
      - LLM
      summary: Fetch Latest Voice Profile
      operationId: fetch_latest_voice_profile
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceProfileResponse'
      security:
      - ApiKeyHeaderPatched: []
  /llm/voice_profile:
    get:
      tags:
      - LLM
      summary: Fetch Voice Profile
      operationId: fetch_voice_profile
      security:
      - ApiKeyHeaderPatched: []
      parameters:
      - name: word_count_milestone
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - 2000
            - 12000
            - 37000
            - 87000
            - 162000
            - 262000
            - 362000
            - 462000
            - 562000
            - 662000
            type: integer
          - type: 'null'
          title: Word Count Milestone
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - LLM
      summary: Create Voice Profile
      operationId: create_voice_profile
      security:
      - ApiKeyHeaderPatched: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceProfileRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    DetectFormalityRequest:
      properties:
        text:
          type: string
          title: Text
          description: Text message to classify for formality level
      type: object
      required:
      - text
      title: DetectFormalityRequest
    ChatRole:
      type: string
      enum:
      - user
      - human
      - assistant
      title: ChatRole
    APIProperties:
      properties:
        language:
          anyOf:
          - type: string
            enum:
            - ''
            - en
            - engb
            - enca
            - zh
            - zhcn
            - de
            - dech
            - es
            - ru
            - ko
            - fr
            - ja
            - pt
            - tr
            - pl
            - ca
            - nl
            - ar
            - sv
            - it
            - id
            - hi
            - hien
            - fi
            - vi
            - he
            - uk
            - el
            - ms
            - cs
            - ro
            - da
            - hu
            - ta
            - 'no'
            - th
            - ur
            - hr
            - bg
            - lt
            - la
            - mi
            - ml
            - cy
            - sk
            - te
            - fa
            - lv
            - bn
            - sr
            - az
            - sl
            - kn
            - et
            - mk
            - br
            - eu
            - is
            - hy
            - ne
            - mn
            - bs
            - kk
            - sq
            - sw
            - gl
            - mr
            - pa
            - si
            - km
            - sn
            - yo
            - so
            - af
            - oc
            - ka
            - be
            - tg
            - sd
            - gu
            - am
            - yi
            - lo
            - uz
            - fo
            - ht
            - ps
            - tk
            - nn
            - mt
            - sa
            - lb
            - my
            - bo
            - tl
            - mg
            - as
            - tt
            - haw
            - ln
            - ha
            - ba
            - jv
            - su
            - yue
          - type: 'null'
          title: Language
          description: Language of the audio
        before_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Before Text
          description: Text before the audio
        after_text:
          anyOf:
          - type: string
          - type: 'null'
          title: After Text
          description: Text after the audio
        selected_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Selected Text
          description: Selected text
        app_type:
          anyOf:
          - type: string
            enum:
            - ai
            - email
            - other
          - type: 'null'
          title: App Type
          description: Type of application
        dictionary:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Dictionary
          description: Dictionary words
      type: object
      title: APIProperties
    BasetenAudioPackets:
      properties:
        packets:
          items:
            type: string
          type: array
          title: Packets
          description: List of base64 encoded audio packets
        volumes:
          items:
            type: number
          type: array
          title: Volumes
          description: List of volume levels for each packet
        packet_duration:
          type: number
          title: Packet Duration
          description: Duration of each packet in seconds
        audio_encoding:
          type: string
          title: Audio Encoding
          description: Audio encoding format (e.g. opus)
        byte_encoding:
          type: string
          title: Byte Encoding
          description: Byte encoding format
      type: object
      required:
      - packets
      - volumes
      - packet_duration
      - audio_encoding
      - byte_encoding
      title: BasetenAudioPackets
    VoiceProfileRequest:
      properties:
        privacy_mode:
          type: boolean
          title: Privacy Mode
        history_rows:
          items:
            $ref: '#/components/schemas/HistoryRow'
          type: array
          minItems: 1
          title: History Rows
        timezone:
          anyOf:
          - type: string
          - type: 'null'
          title: Timezone
        peak_time_label:
          type: string
          title: Peak Time Label
        peak_time_top_app:
          type: string
          title: Peak Time Top App
        most_used_word:
          anyOf:
          - type: string
          - type: 'null'
          title: Most Used Word
        most_removed_word:
          anyOf:
          - type: string
          - type: 'null'
          title: Most Removed Word
        word_count_milestone:
          anyOf:
          - type: integer
            enum:
            - 2000
            - 12000
            - 37000
            - 87000
            - 162000
            - 262000
            - 362000
            - 462000
            - 562000
            - 662000
          - type: 'null'
          title: Word Count Milestone
      type: object
      required:
      - privacy_mode
      - history_rows
      - peak_time_label
      - peak_time_top_app
      title: VoiceProfileRequest
    OCRRequest:
      properties:
        image:
          type: string
          title: Image
      type: object
      required:
      - image
      title: OCRRequest
    CommandModeRouteRequest:
      properties:
        full_text:
          type: string
          title: Full Text
        selected_text:
          type: string
          title: Selected Text
        instruction:
          type: string
          title: Instruction
      type: object
      required:
      - full_text
      - selected_text
      - instruction
      title: CommandModeRouteRequest
    ClassifyIntentContext:
      properties:
        asr_text:
          type: string
          title: Asr Text
          description: Raw ASR transcription text
        app_name:
          type: string
          title: App Name
          description: Name of the foreground app
          default: ''
        app_url:
          type: string
          title: App Url
          description: URL within the foreground app
          default: ''
        before_text:
          type: string
          title: Before Text
          description: Text before the cursor
          default: ''
        selected_text:
          type: string
          title: Selected Text
          description: Currently selected text
          default: ''
        after_text:
          type: string
          title: After Text
          description: Text after the cursor
          default: ''
        ax_context:
          type: string
          title: Ax Context
          description: First 1000 chars of accessibility context
          default: ''
        session_history:
          items:
            $ref: '#/components/schemas/InstructSessionHistoryMessage'
          type: array
          maxItems: 40
          title: Session History
          description: Prior instruct-chat turns for multi-turn follow-ups (e.g. clarifications after a settings confirmation).
      type: object
      required:
      - asr_text
      title: ClassifyIntentContext
    ToolCallDefinition:
      properties:
        name:
          type: string
          title: Name
          description: The name of the function
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: A description of what the function does
        parameters:
          anyOf:
          - type: object
          - type: 'null'
          title: Parameters
          description: JSON Schema object for the function parameters
      type: object
      required:
      - name
      title: ToolCallDefinition
    FlowResponseRequest:
      properties:
        workflow:
          $ref: '#/components/schemas/FlowWorkFlows'
        messages:
          items:
            additionalProperties:
              type: string
            propertyNames:
              enum:
              - speaker
              - message
            type: object
          type: array
          title: Messages
      type: object
      required:
      - workflow
      - messages
      title: FlowResponseRequest
    OpenRouterProviderConfig:
      properties:
        kind:
          type: string
          enum:
          - openrouter
          title: Kind
          default: openrouter
        model:
          type: string
          title: Model
      type: object
      required:
      - model
      title: OpenRouterProviderConfig
      description: Provider config for an OpenRouter-backed model.
    DetectFormalityResponse:
      properties:
        formality_level:
          $ref: '#/components/schemas/PersonalizationStyle'
          description: Detected formality level of the text
      type: object
      required:
      - formality_level
      title: DetectFormalityResponse
    Context:
      properties:
        app:
          anyOf:
          - $ref: '#/components/schemas/App'
          - type: 'null'
          description: Information on the app the user is trying to paste in
        ax_context:
          items:
            type: string
          type: array
          title: Ax Context
          description: List of words from accessibility context
        variable_names:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Variable Names
          description: Variable names extracted from the app context. These get backticked
        file_names:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: File Names
          description: File names extracted from the app context, usually VS Code file names.
        ocr_context:
          items:
            type: string
          type: array
          title: Ocr Context
          description: List of names extracted from user screen content
        dictionary_context:
          items:
            type: string
          type: array
          title: Dictionary Context
          description: List of names in the user's dictionary
        dictionary_replacements:
          additionalProperties:
            type: string
          type: object
          title: Dictionary Replacements
          description: Mapping for replacing phrases/snippets in the user's dictionary
        dictionary_snippets:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
          title: Dictionary Snippets
          description: Mapping of stripped snippet triggers to full triggers
        user_identifier:
          anyOf:
          - type: string
          - type: 'null'
          title: User Identifier
          description: Identifier of the user within the foreground app (e.g., X username, email, etc.)
        user_first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: User First Name
          description: First name of the user making the request
        user_last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: User Last Name
          description: Last name of the user making the request
        textbox_contents:
          anyOf:
          - $ref: '#/components/schemas/TextboxContents'
          - type: 'null'
          description: Selected and surrounding text in the textbox that is being dictated into
        screenshot:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: 'null'
          title: Screenshot
          description: Screenshot of the user's screen at time of dictation
        content_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Text
          description: Text content of the foreground app at time of dictation
        content_html:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Html
          description: HTML content of the foreground app at time of dictation
        conversation:
          anyOf:
          - $ref: '#/components/schemas/Conversation'
          - type: 'null'
          description: Conversation history for a dictation
        session_dictation_apps:
          items:
            type: string
          type: array
          title: Session Dictation Apps
          description: List of all applications (names, bundle IDs, URLs) used for dictation in this session
      type: object
      title: Context
    AsrAudioChunksRequest:
      properties:
        access_token:
          type: string
          title: Access Token
          description: Access token for authentication
