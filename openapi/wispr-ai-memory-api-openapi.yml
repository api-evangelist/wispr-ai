openapi: 3.2.0
info:
  title: Wispr Backend Memory API
  description: Wispr Backend API
  version: 0.5.2
tags:
- name: Memory
paths:
  /api/v1/memory/ingest:
    post:
      tags:
      - Memory
      summary: Ingest a batch of ActionEvents into the voice memory system
      description: Accept a batch of ActionEnvelopes and schedule fire-and-forget Graphiti writes (202).
      operationId: ingest_memory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryIngestRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryIngestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /api/v1/memory/health:
    get:
      tags:
      - Memory
      summary: Check voice-memory Graphiti connectivity
      description: Return whether Graphiti's ``/health`` endpoint responds.
      operationId: memory_health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryHealthResponse'
  /api/v1/memory/context:
    post:
      tags:
      - Memory
      summary: Return compact prompt-ready voice memory context
      description: 'Return compact, prompt-ready Graphiti memory: the client-facing prompt contract.'
      operationId: memory_context
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryContextRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryContextResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
  /api/v1/memory/list:
    get:
      tags:
      - Memory
      summary: 'Debug: list the caller''s raw Graphiti voice memories'
      description: 'Debug: raw Graphiti episodes + a broad fact/node sample. Prompt consumers use ``/context``.'
      operationId: list_memory
      security:
      - ApiKeyHeaderPatched: []
      parameters:
      - name: limit_episodes
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: Max episodes to return
          default: 100
          title: Limit Episodes
        description: Max episodes to return
      - name: max_facts
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          description: Max facts from broad semantic search
          default: 50
          title: Max Facts
        description: Max facts from broad semantic search
      - name: max_nodes
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          description: Max entity nodes from broad semantic search
          default: 50
          title: Max Nodes
        description: Max entity nodes from broad semantic search
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/memory/search:
    post:
      tags:
      - Memory
      summary: 'Debug: raw Graphiti search over the caller''s voice memory'
      description: 'Debug: raw Graphiti fact/node search for the caller''s dictation context (passthrough).'
      operationId: search_memory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemorySearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyHeaderPatched: []
components:
  schemas:
    MemoryListResponse:
      properties:
        query:
          type: string
          title: Query
        episodes:
          items:
            type: object
          type: array
          title: Episodes
        facts:
          items:
            type: object
          type: array
          title: Facts
        nodes:
          items:
            type: object
          type: array
          title: Nodes
      type: object
      required:
      - query
      - episodes
      - facts
      - nodes
      title: MemoryListResponse
      description: Debug listing of a user's memory episodes, facts, and nodes.
    IngestResultRow:
      properties:
        client_event_id:
          type: string
          format: uuid
          title: Client Event Id
        status:
          type: string
          enum:
          - accepted
          - rejected
          title: Status
      type: object
      required:
      - client_event_id
      - status
      title: IngestResultRow
      description: Per-event ingest outcome, keyed by the client event id.
    MemoryWarmUpContext:
      properties:
        app:
          anyOf:
          - type: string
          - type: 'null'
          title: App
        app_category:
          anyOf:
          - type: string
          - type: 'null'
          title: App Category
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        app_name:
          anyOf:
          - type: string
          - type: 'null'
          title: App Name
        mode:
          anyOf:
          - type: string
            enum:
            - dictation
            - generation
          - type: 'null'
          title: Mode
        proper_nouns:
          items:
            type: string
          type: array
          title: Proper Nouns
        excerpt:
          anyOf:
          - type: string
          - type: 'null'
          title: Excerpt
      type: object
      title: MemoryWarmUpContext
      description: Dictation context for retrieval; the server synthesizes the Graphiti query.
    AppContext:
      properties:
        app_name:
          anyOf:
          - type: string
          - type: 'null'
          title: App Name
        app_url:
          anyOf:
          - type: string
          - type: 'null'
          title: App Url
        bundle_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Bundle Id
      type: object
      title: AppContext
      description: Identifying details of the app an action occurred in.
    MemoryHealthResponse:
      properties:
        graphiti_reachable:
          type: boolean
          title: Graphiti Reachable
        graphiti:
          anyOf:
          - type: object
          - type: 'null'
          title: Graphiti
      type: object
      required:
      - graphiti_reachable
      title: MemoryHealthResponse
      description: Health check reporting Graphiti reachability and detail.
    MemoryIngestRequest:
      properties:
        actions:
          items:
            $ref: '#/components/schemas/ActionEnvelope'
          type: array
          maxItems: 50
          minItems: 1
          title: Actions
      type: object
      required:
      - actions
      title: MemoryIngestRequest
      description: Batch of action events to ingest into memory.
    ActionEnvelope:
      properties:
        client_event_id:
          type: string
          format: uuid
          title: Client Event Id
        type:
          type: string
          title: Type
        ts:
          type: string
          format: date-time
          title: Ts
        session_id:
          type: string
          title: Session Id
        platform:
          type: string
          enum:
          - desktop
          - ios
          - android
          title: Platform
          default: desktop
        platform_version:
          type: string
          title: Platform Version
        app_context:
          $ref: '#/components/schemas/AppContext'
        payload:
          type: object
          title: Payload
      type: object
      required:
      - client_event_id
      - type
      - ts
      - session_id
      - platform_version
      - app_context
      title: ActionEnvelope
      description: One action event from the desktop or mobile client.
    MemorySearchRequest:
      properties:
        context:
          $ref: '#/components/schemas/MemoryWarmUpContext'
        max_facts:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: Max Facts
          default: 10
        max_nodes:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: Max Nodes
          default: 10
      type: object
      title: MemorySearchRequest
      description: Debug request to search memory facts and nodes for a context.
    MemoryContextRequest:
      properties:
        context:
          $ref: '#/components/schemas/MemoryWarmUpContext'
        max_facts:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: Max Facts
          default: 10
        max_nodes:
          type: integer
          maximum: 50.0
          minimum: 0.0
          title: Max Nodes
          default: 0
        max_prompt_chars:
          type: integer
          maximum: 8000.0
          minimum: 200.0
          title: Max Prompt Chars
          default: 2000
      type: object
      title: MemoryContextRequest
      description: Request for a synthesized memory prompt block given dictation context.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    MemoryIngestResponse:
      properties:
        accepted:
          type: integer
          title: Accepted
        rejected:
          type: integer
          title: Rejected
        results:
          items:
            $ref: '#/components/schemas/IngestResultRow'
          type: array
          title: Results
      type: object
      required:
      - accepted
      - rejected
      - results
      title: MemoryIngestResponse
      description: 'Ingest summary: accepted/rejected counts and per-event results.'
    MemoryContextResponse:
      properties:
        prompt_block:
          type: string
          title: Prompt Block
      type: object
      required:
      - prompt_block
      title: MemoryContextResponse
      description: The synthesized memory prompt block to prepend for retrieval.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MemorySearchResponse:
      properties:
        query:
          type: string
          title: Query
        facts:
          items:
            type: object
          type: array
          title: Facts
        nodes:
          items:
            type: object
          type: array
          title: Nodes
      type: object
      required:
      - query
      - facts
      - nodes
      title: MemorySearchResponse
      description: 'Debug search results: the synthesized query plus matched facts and nodes.'
  securitySchemes:
    ApiKeyHeaderPatched:
      type: apiKey
      in: header
      name: Authorization
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
