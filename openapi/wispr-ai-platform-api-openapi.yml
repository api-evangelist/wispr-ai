            - mg
            - as
            - tt
            - haw
            - ln
            - ha
            - ba
            - jv
            - su
            - yue
          - type: 'null'
          title: Language
          description: Language of the audio
        before_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Before Text
          description: Text before the audio
        after_text:
          anyOf:
          - type: string
          - type: 'null'
          title: After Text
          description: Text after the audio
        selected_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Selected Text
          description: Selected text
        app_type:
          anyOf:
          - type: string
            enum:
            - ai
            - email
            - other
          - type: 'null'
          title: App Type
          description: Type of application
        dictionary:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Dictionary
          description: Dictionary words
      type: object
      title: APIProperties
    CreateUserInviteRequest:
      properties:
        emails:
          items:
            type: string
          type: array
          title: Emails
        role:
          $ref: '#/components/schemas/Role'
      type: object
      required:
      - emails
      - role
      title: CreateUserInviteRequest
    ChatMessage:
      properties:
        role:
          $ref: '#/components/schemas/ChatRole'
          description: Role of the message sender
        content:
          type: string
          title: Content
          description: Content of the message
        sender_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Sender Id
          description: Identifier of the message sender
      type: object
      required:
      - role
      - content
      title: ChatMessage
    Role:
      type: string
      enum:
      - admin
      - member
      title: Role
      description: A platform team member's role.
    CreateAPIKeyRequest:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: CreateAPIKeyRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    ApiKeyHeaderPatched:
      type: apiKey
      in: header
      name: Authorization
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
