          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Platform
      summary: Remove User
      operationId: remove_user
      security:
      - ApiKeyHeaderPatched: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Organization Id
      - name: email
        in: path
        required: true
        schema:
          type: string
          title: Email
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/platform/organizations/{organization_id}/billing/credits:
    get:
      tags:
      - Platform
      summary: Get Credits
      operationId: get_credits
      security:
      - ApiKeyHeaderPatched: []
      parameters:
      - name: organization_id
