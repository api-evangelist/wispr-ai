          - type: integer
          - type: 'null'
          title: Since
      type: object
      required:
      - type
      title: SyncClientSubscribe
      description: 'First frame after the WS upgrade.


        Establishes the subscription and optionally resumes from ``since`` (the

        client''s last delivered sequence; omitted on a cold start).'
    SyncClientAck:
      properties:
        type:
          type: string
          const: ack
          title: Type
        seq:
          type: integer
          title: Seq
      type: object
      required:
      - type
      - seq
      title: SyncClientAck
